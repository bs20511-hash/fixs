<script>
        // Lightweight interaction: Follow cursor glow
        document.addEventListener('mousemove', (e) => {
            const glows = document.querySelectorAll('.bg-glow');
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            glows.forEach((glow, idx) => {
                const factor = idx === 0 ? 1 : -1;
                glow.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });
        });
</script>

<script>
  function doLogin() {
    const emailEl = document.getElementById('emailInput');
    const passEl = document.getElementById('passInput');
    
    const email = emailEl ? emailEl.value.trim().toLowerCase() : '';
    const password = passEl ? passEl.value.trim() : '';

    const targetEmail = "bs20511@boripat.ac.th";
    const targetPassword = "123456";

    // ตรวจสอบอีเมลและรหัสผ่านแบบเจาะจง
    if (email === targetEmail && password === targetPassword) {
      window.location.href = './reporter_portal/';
    } else {
      alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณากรอกใหม่อีกครั้ง");

  }
