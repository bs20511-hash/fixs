<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบแจ้งซ่อม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4">

<main class="w-full max-w-md">
  <div class="bg-surface-container rounded-2xl p-6 shadow-xl border border-outline-variant/30">
    <h1 class="text-2xl font-bold text-center mb-6 text-on-surface">เข้าสู่ระบบ</h1>

    <!-- ล็อกอินฟอร์มแบบปิดล็อกการเข้าถึง -->
    <form id="loginForm" class="space-y-5 animate-in fade-in duration-300">
      <div class="space-y-2">
        <label class="font-label-sm text-label-sm text-on-surface-variant ml-1">อีเมล</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
            <span class="material-symbols-outlined">mail</span>
          </div>
          <input id="email" type="email" class="w-full bg-surface-lowest border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-on-surface font-body-md focus:outline-none focus:ring-2" required>
        </div>
      </div>
      <div class="space-y-2">
        <label class="font-label-sm text-label-sm text-on-surface-variant ml-1">รหัสผ่าน</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
            <span class="material-symbols-outlined">lock</span>
          </div>
          <input id="password" type="password" class="w-full bg-surface-lowest border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-on-surface font-body-md focus:outline-none focus:ring-2" required>
        </div>
      </div>
      <div class="flex justify-end">
        <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">ลืมรหัสผ่าน?</a>
      </div>
      <button type="submit" class="w-full bg-primary py-4 rounded-xl text-on-primary font-bold text-label-md hover:brightness-110 active:scale-[0.98] transition-all">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>

  <!-- Footer -->
  <footer class="mt-8 text-center">
    <div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full border border-outline-variant/20 shadow-sm">
      <span class="material-symbols-outlined text-info animate-pulse" style="font-size: 16px;">bolt</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant/80 tracking-tight">
        ⚡ Cloudflare Workers Serverless Architecture | Encrypted HttpOnly Session Guard
      </span>
    </div>
  </footer>
</main>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    // ระงับการรีเฟรชหรือเปลี่ยนหน้าเว็บโดยสิ้นเชิง
    e.preventDefault();

    // เด้งเตือนปฏิเสธการเข้าสู่ระบบเสมอ ไม่ว่าจะกรอกอะไรมาก็ตาม
    alert("ไม่อนุญาตให้เข้าสู่ระบบ: ข้อมูลไม่ถูกต้อง หรือ บัญชีของคุณไม่มีสิทธิ์เข้าถึง");
    
    // คืนค่าว่างให้ช่องกรอกข้อมูล
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  });
</script>
</body>
</html>
