<script>
        function switchTab(type) {
            const staffTab = document.getElementById('tab-staff');
            const adminTab = document.getElementById('tab-admin');
            const staffView = document.getElementById('view-staff');
            const adminView = document.getElementById('view-admin');

            if (type === 'staff') {
                staffTab.classList.add('tab-active', 'text-primary');
                staffTab.classList.remove('text-on-surface-variant');
                adminTab.classList.remove('tab-active', 'text-primary');
                adminTab.classList.add('text-on-surface-variant');
                
                staffView.classList.remove('hidden');
                adminView.classList.add('hidden');
            } else {
                adminTab.classList.add('tab-active', 'text-primary');
                adminTab.classList.remove('text-on-surface-variant');
                staffTab.classList.remove('tab-active', 'text-primary');
                staffTab.classList.add('text-on-surface-variant');
                
                adminView.classList.remove('hidden');
                staffView.classList.add('hidden');
            }
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.innerText = 'visibility';
            }
const API_URL = "https://script.google.com/macros/s/AKfycbzUUilqQLG44Dg8qqgkYqrnLqqvQD2EnrLF5_xHdASe3j75iWdNdNUcTE0jgV49apS11Q/exec";

async function checkLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!email || !password) {
    alert("กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน");
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'login',
        username: email,
        password: password
      })
    })

    const result = await response.json();
    if (result.success) {
      alert("เข้าสู่ระบบสำเร็จ!");
      window.location.href = "../technician/index.html";
    } else {
      alert(result.message || "อีเมลหรือรหัสผ่านไม่ถูกต้อง");
    }
  } catch (error) {
    console.error("Login Error:", error);
    alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบ");
  }
}
        // Lightweight interaction: Follow cursor glow
        document.addEventListener('mousemove', (e) => {
            const glows = document.querySelectorAll('.bg-glow');
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            glows.forEach((glow, idx) => {
                const factor = idx === 0 ? 1 : -1;
                glow.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });
        });
    </script>
